<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Say Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="glow">Simon game</h1>
    <h2 class="glow">Press Any Key to Start the Game</h2>

   

    <div class="btn-container">
        <div class="line_one">
             <div class="btn green" id="green"></div>
             <div class="btn red" id="red"></div>
        </div>

        <div class="line_two">
             <div class="btn yellow" id="yellow"></div>
             <div class="btn blue" id="blue"></div>
        </div>       
       
    </div>

     <div >
        <h2 class="score">Highscore : 0</h2>
    </div>

    <script src="app.js"></script>
</body>
</html>
